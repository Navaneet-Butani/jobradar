name: outreach

# Reads replies/bounces out of each user's mailbox, queues any follow-up that
# has come due, then sends whatever fits inside the daily cap.
#
# SECRET_KEY must match the one the API runs with — stored SMTP passwords are
# encrypted with a key derived from it, and a mismatch makes every send fail
# with "could not be decrypted".

on:
  schedule:
    # 09:30 IST — morning check, before the working day gets going
    - cron: '0 4 * * *'
    # 18:30 IST — evening check, catches same-day replies
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      no_send:
        description: 'Sync replies/bounces only, send nothing'
        type: boolean
        required: false
        default: false

jobs:
  outreach:
    if: github.event_name == 'workflow_dispatch' || vars.JOBRADAR_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - run: python -m scripts.outreach_sync ${{ github.event.inputs.no_send == 'true' && '--no-send' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
