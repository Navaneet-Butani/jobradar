name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jobradar" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://jobradar:jobradar@localhost:5432/jobradar
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 app scripts tests alembic
      - name: Unit tests
        run: pytest -q
      - name: Migrations build an empty database, with no drift from the models
        run: |
          alembic upgrade head
          alembic check
      - name: API boots and answers
        run: |
          python -m scripts.create_admin --email ci@example.com --password ci-password-123
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/v1/health/ping && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
