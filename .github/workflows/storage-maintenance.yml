name: storage-maintenance

on:
  schedule:
    # Once daily, 03:00 IST — off-peak, ahead of the 07:00 ingest run
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    if: github.event_name == 'workflow_dispatch' || vars.JOBRADAR_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.storage_maintenance run-all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
